<style>
/* Layout: sticky module tab bar over a single working column; tables scroll inside their own frames.
   Accent is the bromocresol purple of the CMT paddle. */
:root{
  --bg:#f5f4f8; --surface:#ffffff; --sunk:#eceaf2; --line:#dcd8e6; --fg:#1f1b2b; --fg2:#575168; --muted:#857f96;
  --accent:#6a3fb5; --accent-soft:#ece4fa; --accent-ink:#ffffff;
  --good:#1f7a4d; --good-bg:#e1f3e9; --warn:#9a6200; --warn-bg:#fcf0d7; --bad:#b3261e; --bad-bg:#fbe3e1;
  --bar:#7b55c2;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131c; --surface:#1e1b28; --sunk:#262233; --line:#363047; --fg:#ece9f4; --fg2:#b6b0c6; --muted:#8c869c;
  --accent:#a988e8; --accent-soft:#2f2645; --accent-ink:#15131c;
  --good:#6fd39c; --good-bg:#173527; --warn:#f0bd5a; --warn-bg:#3a2d12; --bad:#ff8a80; --bad-bg:#43201d; --bar:#9a7ae0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131c; --surface:#1e1b28; --sunk:#262233; --line:#363047; --fg:#ece9f4; --fg2:#b6b0c6; --muted:#8c869c;
  --accent:#a988e8; --accent-soft:#2f2645; --accent-ink:#15131c;
  --good:#6fd39c; --good-bg:#173527; --warn:#f0bd5a; --warn-bg:#3a2d12; --bad:#ff8a80; --bad-bg:#43201d; --bar:#9a7ae0;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.gate{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.gate .card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px}
.gate .logo{width:56px;height:56px;border-radius:12px}
.gate input{font-size:16px;padding:10px 12px}
.userbox{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.net{display:inline-flex;align-items:center;gap:5px}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.net.off::before{background:var(--warn)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between;padding-block:16px 10px}
h1{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0;letter-spacing:.01em}
h1 small{display:block;font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--fg2)}
.sync{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.sync b{font-weight:500;color:var(--fg2)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:none;padding:10px 14px;color:var(--fg2);text-decoration:none;border-bottom:3px solid transparent;font-weight:500;white-space:nowrap}
nav.tabs a .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:6px}
nav.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main .wrap{padding-block:20px 60px;display:grid;gap:20px}
h2{font-family:var(--f-display);font-size:19px;font-weight:600;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:15.5px;font-weight:600;margin:0 0 8px}
.lead{color:var(--fg2);margin:4px 0 0;max-width:75ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
label.f,div.f{display:grid;gap:3px;font-size:12px;color:var(--fg2);min-width:0}
label.f span.req::after{content:" *";color:var(--bad)}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[readonly]{background:var(--sunk)}
textarea{min-height:90px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:13px;background:var(--surface)}
.chk:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chk input{margin:0;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{padding:5px 10px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{background:var(--sunk);font-weight:600;font-size:12px;color:var(--fg2);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.tw{white-space:normal;min-width:180px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--fg2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.sir{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font-family:var(--f-mono);font-size:11px;font-weight:600}
.sir.s{background:var(--good-bg);color:var(--good)} .sir.i{background:var(--warn-bg);color:var(--warn)} .sir.r{background:var(--bad-bg);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface)}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:12px;color:var(--fg2)}
.kpi .b{font-size:11.5px;color:var(--muted);margin-top:2px}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 64px;gap:8px;align-items:center;font-size:12.5px}
.bar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg2)}
.bar .tr{display:block;height:14px;background:var(--sunk);border-radius:0 4px 4px 0}
.bar .fl{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.bar .vl{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12px}
.note{font-size:12.5px;color:var(--fg2);background:var(--sunk);border-radius:6px;padding:8px 10px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.good{background:var(--good-bg);color:var(--good)}
.empty{padding:28px;text-align:center;color:var(--fg2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.pager{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--fg2)}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 12px;margin:0;min-width:0}
legend{font-family:var(--f-display);font-weight:600;font-size:13.5px;padding:0 6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.cowcard dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px 16px;margin:0}
.cowcard dt{font-size:11.5px;color:var(--muted)} .cowcard dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.refs li{margin-bottom:6px} .refs a{color:var(--accent)}
.src{font-size:11.5px;color:var(--muted)}
sup.c{color:var(--accent);font-size:10.5px;font-weight:600}
svg text{fill:var(--fg2);font-family:var(--f-body);font-size:11px}
.hm td.cell{text-align:center;font-family:var(--f-mono);font-size:12px}
.confirm{display:inline-flex;gap:6px;align-items:center}
.risk-total{font-family:var(--f-display);font-weight:600}
.alerts{display:flex;flex-wrap:wrap;gap:8px;padding-block:10px 0}
.alerts button{display:inline-flex;gap:6px;align-items:center;border-radius:999px;font-size:12.5px;padding:4px 12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.alerts button.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.alerts button.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.alerts button.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.qk{display:grid;gap:14px;max-width:640px}
.qk input[type=text],.qk input[type=date]{font-size:18px;padding:10px 12px}
.qbtns{display:flex;flex-wrap:wrap;gap:8px}
.qb{min-height:48px;min-width:56px;padding:8px 14px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.qb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qb.sm{min-height:40px;font-size:14px;padding:6px 10px}
.qcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.qcard h4{margin:0;font-family:var(--f-display);font-size:18px}
.qlbl{font-size:12.5px;color:var(--fg2)}
.cmp td.up{color:var(--bad)}.cmp td.down{color:var(--good)}
@media (prefers-reduced-motion:no-preference){.bar .fl{transition:width .3s ease}}
@media screen{.print-only{display:none!important}}
@media print{
  :root{--bg:#fff;--surface:#fff;--sunk:#f1eff5;--line:#d8d4e2;--fg:#1f1b2b;--fg2:#4a4458;--muted:#6f6982;--accent:#5a32a3;--accent-soft:#ece4fa;--accent-ink:#fff;
    --good:#1f7a4d;--good-bg:#e1f3e9;--warn:#8a5700;--warn-bg:#fcf0d7;--bad:#a8231b;--bad-bg:#fbe3e1;--bar:#7b55c2;color-scheme:light;padding:0}
  @page{size:A4;margin:12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:11.5px}
  header.top,nav.tabs,#alerts,.gate,.toast,.btn,button,.file,input,select,textarea,label.chk,.no-print,.pager,details>summary{display:none!important}
  label.f:not(:has(span.req)){display:none!important}
  details{display:block}details>*{display:block}
  .wrap{max-width:none;padding:0!important}
  main .wrap{padding-block:0;gap:10px}
  .panel{border:1px solid var(--line);padding:10px;break-inside:avoid}
  .tbl{overflow:visible!important;max-height:none!important;border:0}
  th{position:static}
  th,td{padding:3px 6px;white-space:normal}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .grid2,.grid3{grid-template-columns:1fr 1fr}
  .print-head{display:block!important;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:4px}
  .print-head h1{font-size:18px}
  button[data-gocow2]{display:inline!important;border:0;background:none;padding:0;font:inherit;font-weight:600}
  .print-note{white-space:pre-wrap;border:1px solid var(--line);border-radius:6px;padding:8px}
}
@media (max-width:560px){h1{font-size:19px}.bar{grid-template-columns:minmax(80px,40%) 1fr 54px}}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <h1>Mastitis Herd Analytics<small>ระบบสรุปข้อมูลโคเต้านมอักเสบ · One Stop Dairy Farm</small></h1>
  <div style="display:grid;gap:4px;justify-items:end"><div class="userbox" id="userBox"></div><div class="sync" id="sync"><span>กำลังเชื่อมต่อฐานข้อมูล…</span></div></div>
</div></header>
<nav class="tabs" aria-label="โมดูล"><div class="wrap" id="tabs">
  <a href="#quick"><span class="n">+</span>บันทึกด่วน</a>
  <a href="#herd"><span class="n">1</span>ฐานข้อมูลโค &amp; ผลเพาะเชื้อ</a>
  <a href="#cases"><span class="n">2</span>บันทึกโคป่วย</a>
  <a href="#risk"><span class="n">3</span>ความเสี่ยงระดับฝูง</a>
  <a href="#cow"><span class="n">4</span>สรุปรายตัว</a>
  <a href="#summary"><span class="n">5</span>สรุปรายฝูง</a>
  <a href="#users" id="usersTab" hidden><span class="n">⚙</span>ผู้ใช้</a>
</div></nav>
<div class="wrap alerts" id="alerts" aria-live="polite"></div>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" hidden></div>
<div class="gate" id="gate">
  <form class="card" id="loginForm" autocomplete="on">
    <img class="logo" src="icons/icon-192.png" alt="">
    <div><h2 style="margin:0">Mastitis Herd Analytics</h2><p class="lead" style="margin-top:4px">One Stop Dairy Farm · เข้าสู่ระบบเพื่อบันทึกข้อมูล</p></div>
    <div id="gateMsg" class="note" hidden></div>
    <div id="loginFields" style="display:grid;gap:12px">
      <label class="f">อีเมล<input type="email" id="lg_email" autocomplete="username" required></label>
      <label class="f">รหัสผ่าน<input type="password" id="lg_pass" autocomplete="current-password" required></label>
      <button class="btn pri" type="submit" id="lg_btn" style="padding:10px">เข้าสู่ระบบ</button>
      <button class="btn" type="button" id="lg_reset">ลืมรหัสผ่าน</button>
    </div>
    <button class="btn" type="button" id="demoBtn" hidden>เปิดโหมดทดลอง (ข้อมูลตัวอย่าง ไม่บันทึก)</button>
  </form>
</div>

<script>
/* ============ constants ============ */
const LISTS={
  repro:['Colostrum','Before','Ready','Bred','No Heat','Open','Open and No Heat','Pregnant'],
  milking:['Milking','Dry'],
  barn:['1','2','3','4','5','6/1','6/2','7','8','9','10','11','12','pre-dry','dry','pre-calving','vip-new','vip-old','sand'],
  quarter:['LF','LH','RF','RH'],
  yn:['Yes','No'],
  palpation:['Normal','Swelling','Frim-Hard','Red','Hot','Edema'],
  secretion:['Normal','Clot','Curd','Watery','Yellow Watery','Serosanguineous','Purulent'],
  type:['New','Recurrent','Chronic'],
  score:['1 Mild','2 Moderate','3 Severe'],
  route:['IMM (ใส่เต้า)','IM','IV','SC','PO','Teat sealant'],
  outcome:['กำลังรักษา','หาย','ไม่หาย-เปลี่ยนยา','ปิดเต้า/ดรายเต้า','คัดทิ้ง','ตาย'],
  bedding:['ทราย','ขี้เลื่อย','แกลบ','ฟาง','มูลโครีไซเคิล (RMS)','แผ่นยาง/ที่นอนยาง','ดิน','อื่น ๆ']
};
const CASE_COLS=[['Case No','caseNo'],['Date detected','dateDetected','d'],['Inspector','inspector'],['Treatment Date','treatDate','d'],['ID','cow'],['Lactation','lact','n'],['Last Calving Date','calving','d'],['DIM','dim','n'],['Reproductive Status','repro'],['Milking Status','milking'],['Last Breeding Date','lastBreed','d'],['Days from Last Breeding','daysBreed','n'],['Weekly Average Yield','yield','n'],['Barn','barn'],['Quarter','quarter'],['Milk Blood','blood'],['Palpation Udder','palpation'],['Secretion','secretion'],['Fever','fever'],['Appetite Drop','appetite'],['Downer','downer'],['Type of Case','type'],['Clinical Score','score'],['Last SCC','scc','n'],['Culture','culture'],['CMT','cmt']];
const TREAT_COLS=[['Case ID','caseNo'],['วันที่เริ่มรักษา','start','d'],['ยา','drug'],['Route','route'],['Dose','dose'],['Days','days','n'],['วันที่หายตะกอน','clearDate','d'],['วันผ่านยา','withdrawDate','d'],['Outcome','outcome'],['หยุดยา (วัน)','wdDays','n']];
const RISK_COLS=[['วันที่','date','d'],['Barn','barn'],['จำนวนโค','cows','n'],['Bedding Type','bedding'],['Moisture Score','moisture','n'],['Temp','temp','n'],['Humidity','hum','n'],['THI','thi','n'],['Udder Score','udder','n'],['Leg Score','leg','n'],['Bulk Tank SCC','btscc','n']];

function toISO(v){
  if(v==null||v==='')return null;
  let y,m,d;
  if(typeof v==='number'){ if(v<1000)return null; const p=XLSX.SSF.parse_date_code(v); if(!p)return null; y=p.y;m=p.m;d=p.d; }
  else if(v instanceof Date){ y=v.getFullYear();m=v.getMonth()+1;d=v.getDate(); }
  else { const s=String(v).trim(); let a;
    if((a=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))){y=+a[1];m=+a[2];d=+a[3];}
    else if((a=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){d=+a[1];m=+a[2];y=+a[3]; if(y<100)y+=y>40?2500:2000;}
    else return null; }
  if(y>2400)y-=543; else if(y<1990)y=2500+(y%100)-543;
  if(y<2000||y>2035||m<1||m>12||d<1||d>31)return null;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}

async function retry(fn){let e;for(let i=0;i<4;i++){try{return await fn();}catch(x){e=x;if(!['unavailable','resource_exhausted'].includes(x&&x.code))throw x;await new Promise(r=>setTimeout(r,800*(i+1)+Math.random()*400));}}throw e;}
/* Firestore writes land in the on-device cache at once and sync when the phone is back online,
   so the app waits at most ~1.5 s for the server before moving on. */
const settle=p=>{p.catch(e=>toast('บันทึกไปยังเซิร์ฟเวอร์ไม่สำเร็จ ('+(e.code||e.message)+')'));return Promise.race([p,new Promise(r=>setTimeout(r,1500))]);};
const clean=d=>JSON.parse(JSON.stringify(d));
/* Firestore does not allow arrays inside arrays: herd rows are stored as [{c:[...]}, …] and unwrapped on read. */
const enc=(c,d)=>c==='herd'&&d&&Array.isArray(d.rows)?Object.assign({},d,{rows:d.rows.map(r=>Array.isArray(r)?{c:r}:r)}):d;
const dec=rows=>(rows||[]).map(r=>r&&Array.isArray(r.c)?r.c:r);
async function put(coll,id,data){
  if(S.db){await settle(S.db.collection(coll).doc(id).set(clean(enc(coll,data))));}
  else{applyLocal(coll,id,data);}
}
async function del(coll,id){if(S.db){await settle(S.db.collection(coll).doc(id).delete());}else{applyLocal(coll,id,null);}}
function applyLocal(coll,id,data){
  if(coll==='cases'){if(data)S.cases[id]=data;else delete S.cases[id];}
  if(coll==='risk'){if(data)S.risk[id]=data;else delete S.risk[id];}
  if(coll==='herd'){if(data)S.herdChunks[id]=data.rows;else delete S.herdChunks[id];}
  if(coll==='cultures'){if(data)S.culChunks[id]=data.rows;else delete S.culChunks[id];}
  if(coll==='meta'){if(id==='herd'){S.herdMeta=data;S.herdCols=data?data.cols:[];} if(id==='cultures')S.culMeta=data;if(id==='presets')S.presets=(data&&data.items)||[];}
  if(coll==='notes')S.note=data;

}

async function connect(){
  if(!configured){
    S.ready={herd:true,cul:true,cases:true,risk:true};
    gate(true,'ยังไม่ได้ตั้งค่า Firebase: ใส่ค่าในไฟล์ firebase-config.js ตามคู่มือ README ก่อนใช้งานจริง','warn');
    $('#loginFields').hidden=true;$('#demoBtn').hidden=false;return;}
  firebase.initializeApp(CFG);
  const db=firebase.firestore();
  try{await db.enablePersistence({synchronizeTabs:true});}catch(e){/* private mode or old browser: online only */}
  firebase.auth().onAuthStateChanged(async u=>{
    unsubs.forEach(f=>f());unsubs=[];S.db=null;
    if(!u){S.userEmail='';setUser('');gate(true);return;}
    const email=(u.email||'').toLowerCase();
    S.role='';
    try{const m=await db.collection('members').doc(email).get();
      if(m.exists)S.role=(m.data()||{}).role||'';
      if(!m.exists){gate(true,`บัญชี ${email} ยังไม่ได้รับสิทธิ์ใช้งาน ให้ผู้ดูแลเพิ่มอีเมลนี้ในคอลเลกชัน members`,'bad');await firebase.auth().signOut();return;}}
    catch(e){ if(e.code==='permission-denied'){gate(true,`บัญชี ${email} ยังไม่ได้รับสิทธิ์ใช้งาน`,'bad');await firebase.auth().signOut();return;} /* offline: continue from cache */ }
    S.userEmail=email;setUser(email);$('#usersTab').hidden=S.role!=='admin';gate(false);listen(db);
  });
}
function listen(db){
  S.db=db;
  const err=e=>{syncLine('ฐานข้อมูลขัดข้อง ('+(e&&e.code)+')');};
  const on=(c,f)=>unsubs.push(db.collection(c).onSnapshot({includeMetadataChanges:false},f,err));
  on('meta',s=>{s.docs.forEach(d=>{const v=d.data();if(d.id==='herd'){S.herdMeta=v;S.herdCols=v.cols||[];}if(d.id==='cultures')S.culMeta=v;if(d.id==='presets')S.presets=v.items||[];});queueRender();});
  on('herd',s=>{S.herdChunks={};s.docs.forEach(d=>S.herdChunks[d.id]=dec(d.data().rows));S.ready.herd=true;queueRender();});
  on('cultures',s=>{S.culChunks={};s.docs.forEach(d=>S.culChunks[d.id]=d.data().rows||[]);S.ready.cul=true;queueRender();});
  on('cases',s=>{S.cases={};s.docs.forEach(d=>S.cases[d.id]=d.data());S.ready.cases=true;queueRender();});
  on('risk',s=>{S.risk={};s.docs.forEach(d=>S.risk[d.id]=d.data());S.ready.risk=true;queueRender();});
  on('notes',s=>{const d=s.docs.find(x=>x.id==='farm');S.note=d?d.data():null;queueRender();});
  if(S.role==='admin')on('members',s=>{S.members=s.docs.map(d=>Object.assign({email:d.id},d.data()));if(route()==='users')render(true);});
}

function herdFiltered(){

  return S.herd.filter(r=>{
    const k=norm(r[0]);
    if(q&&!String(r[0]).toUpperCase().includes(q)&&!String(r[S.herdCols.indexOf('Group')]||'').toUpperCase().includes(q))return false;
    if(st&&r[S.herdCols.indexOf('Lactation Status')]!==st)return false;
    const hc=casesByCow.has(k),hu=culByCow.has(k);
    if(f==='case'&&!hc)return false; if(f==='cul'&&!hu)return false; if(f==='both'&&!(hc&&hu))return false; if(f==='any'&&!(hc||hu))return false;
    return true;});

async function importHerd(file){
  const wb=await readWorkbook(file); let ws=null,rows=null,hi=-1;
  for(const n of wb.SheetNames){const a=aoa(wb.Sheets[n]);const i=a.findIndex(r=>r&&r.some(c=>hkey(c)==='cownumber'));if(i>=0){ws=n;rows=a;hi=i;break;}}
  if(!rows)throw new Error('ไม่พบคอลัมน์ Cow Number ในไฟล์');
  const hdr=rows[hi].map(c=>str(c)); const idx=hdr.map((h,i)=>h?i:-1).filter(i=>i>=0); const ci=hdr.findIndex(h=>hkey(h)==='cownumber');
  const keep=idx.filter(i=>i>=ci); const cols=keep.map(i=>hdr[i]);
  const out=[];
  for(const r of rows.slice(hi+1)){ if(!r||r[ci]==null||r[ci]==='')continue;
    out.push(keep.map((i,j)=>{let v=r[i]; const c=cols[j];
      if(/Date|Expected Calving/i.test(c))return toISO(v);
      if(j===0)return String(v).trim();
      if(typeof v==='number')return Math.round(v*100)/100; return v==null?null:String(v).trim();}));}
  if(!out.length)throw new Error('ไม่มีข้อมูลโคในไฟล์');
  const fileDate=out[0][cols.indexOf('Date')]||today();
  toast('กำลังบันทึก '+out.length+' ตัว…');
  const chunks=[];for(let i=0;i<out.length;i+=250)chunks.push(out.slice(i,i+250));
  for(let i=0;i<chunks.length;i++)await put('herd','h'+String(i).padStart(3,'0'),{rows:chunks[i]});
  for(const k of Object.keys(S.herdChunks)){const n=parseInt(k.slice(1),10);if(n>=chunks.length)await del('herd',k);}
  await put('meta','herd',{cols,count:out.length,chunks:chunks.length,fileDate,importedAt:new Date().toISOString().slice(0,19),source:file.name});
  toast('อัปเดตรายชื่อโค '+out.length+' ตัว แล้ว');
}
async function importCultures(file,replace){
  const wb=await readWorkbook(file);let rows=null,hi=-1;
  const names=[...wb.SheetNames].sort((a,b)=>(b==='ผลเพาะเชื้อ')-(a==='ผลเพาะเชื้อ'));
  for(const n of names){const a=aoa(wb.Sheets[n]);const i=a.findIndex(r=>r&&r.some(c=>hkey(c).startsWith('ชนิดเชื้อ'))&&r.some(c=>hkey(c)==='ชื่อสัตว์'));if(i>=0){rows=a;hi=i;break;}}
  if(!rows)throw new Error('ไม่พบคอลัมน์ ชื่อสัตว์ / ชนิดเชื้อ');
  const h=rows[hi].map(hkey); const col=p=>h.findIndex(x=>x.startsWith(p));
  const C={lab:col('หมายเลขจุล'),sent:col('วันที่ส่ง'),sender:col('ชื่อผู้ส่ง'),clin:col('แสดงอาการ'),sub:col('ไม่แสดงอาการ'),combo:col('combo'),lac:col('lactation'),cow:col('ชื่อสัตว์'),sample:col('ชนิดตัวอย่าง'),q:col('ตำแหน่ง'),test:col('ชนิดการตรวจ'),org:col('ชนิดเชื้อ'),rep:col('วันที่รายงาน')};
  const abi={};Object.entries(AB_HDR).forEach(([k,p])=>{abi[k]=h.findIndex(x=>x.replace(/^\d+\./,'').startsWith(p));});
  const recs=[];let last=null;const g=(r,k)=>C[k]>=0?r[C[k]]:null;
  for(const r of rows.slice(hi+1)){ if(!r)continue;
    if(g(r,'lab')){let sent=toISO(g(r,'sent')),rep=toISO(g(r,'rep'));if(sent&&rep&&sent>rep)sent=null;
      const rec={lab:str(g(r,'lab')),sent:sent||rep,rep,sender:str(g(r,'sender')),clin:g(r,'clin')?1:0,sub:g(r,'sub')?1:0,combo:str(g(r,'combo')),lac:num(g(r,'lac')),cow:str(g(r,'cow')),sample:str(g(r,'sample')),q:str(g(r,'q')),test:str(g(r,'test')),org:str(g(r,'org')).replace(/\s+/g,' '),ab:{}};
      Object.entries(abi).forEach(([k,i])=>{const v=i>=0?str(r[i]).toLowerCase():'';if(['s','i','r'].includes(v))rec.ab[k]=v;});
      recs.push(rec);last=rec;}
    else if(last&&g(r,'org')){(last.extra=last.extra||[]).push(str(g(r,'org')).replace(/\s+/g,' '));}}
  if(!recs.length)throw new Error('ไม่มีรายการผลเพาะเชื้อในไฟล์');
  const map=new Map(replace?[]:S.cultures.map(c=>[c.lab,c]));let added=0;recs.forEach(r=>{if(!map.has(r.lab))added++;map.set(r.lab,r);});
  const all=[...map.values()];const chunks=[];for(let i=0;i<all.length;i+=200)chunks.push(all.slice(i,i+200));
  toast('กำลังบันทึกผลเพาะเชื้อ…');
  for(let i=0;i<chunks.length;i++)await put('cultures','c'+String(i).padStart(3,'0'),{rows:chunks[i]});
  for(const k of Object.keys(S.culChunks)){if(parseInt(k.slice(1),10)>=chunks.length)await del('cultures',k);}
  const matched=await autoMatchCultures(recs);
  await put('meta','cultures',{count:all.length,chunks:chunks.length,importedAt:new Date().toISOString().slice(0,19),source:file.name,added,matched});
  toast(`นำเข้า ${recs.length} รายการ (ใหม่ ${added}) รวม ${all.length} · จับคู่เข้าเคส ${matched} เคส`);
}

  if(!ce&&!tr)throw new Error('ไม่พบชีท CASE_ENTRY หรือ TREATMENT');
  const updates=new Map(); let n=0,nt=0;
  if(ce){const h=ce.a[ce.i].map(hkey);const ix=CASE_COLS.map(([hd,k,t])=>[h.indexOf(hkey(hd)),k,t]);
    const used=new Set(Object.keys(S.cases));
    for(const r of ce.a.slice(ce.i+1)){ if(!r)continue; const o={};ix.forEach(([i,k,t])=>{const v=i>=0?r[i]:null;o[k]=t==='d'?toISO(v):t==='n'?num(v):str(v);});
      if(!o.cow)continue; o.dateDetected=o.dateDetected||o.treatDate; if(!o.dateDetected)continue;
      let id=o.caseNo; const base=id&&S.cases[id]?S.cases[id]:null;
      if(!id){ // match an existing case: same cow + date
        const ex=(casesByCow.get(norm(o.cow))||[]).find(x=>x.dateDetected===o.dateDetected); if(ex)id=ex.caseNo;}
      const prev=id&&(updates.get(id)||S.cases[id]);
      if(!id){const y=o.dateDetected.slice(2,4);let k=0;used.forEach(u=>{const m=u.match(/^MC(\d\d)-(\d+)$/);if(m&&m[1]===y)k=Math.max(k,+m[2]);});id='MC'+y+'-'+String(k+1).padStart(4,'0');}
      used.add(id);
      const merged=Object.assign({},prev||{treatments:[]});Object.entries(o).forEach(([k,v])=>{if(v!==''&&v!=null)merged[k]=v;else if(!(k in merged))merged[k]=v;});
      if(['quarter','palpation','secretion','cmt'].some(k=>o[k]))merged.quarters=caseQuarters(Object.assign({},merged,{quarters:null}));
      merged.caseNo=id;merged.updatedAt=new Date().toISOString().slice(0,19);updates.set(id,merged);n++;}}
  if(tr){const h=tr.a[tr.i].map(hkey);const ix=TREAT_COLS.map(([hd,k,t])=>[h.indexOf(hkey(hd)),k,t]);
    for(const r of tr.a.slice(tr.i+1)){ if(!r)continue;const o={};ix.forEach(([i,k,t])=>{const v=i>=0?r[i]:null;o[k]=t==='d'?toISO(v):t==='n'?num(v):str(v);});
      if(!o.caseNo)continue; const cs=updates.get(o.caseNo)||(S.cases[o.caseNo]&&JSON.parse(JSON.stringify(S.cases[o.caseNo]))); if(!cs)continue;
      const cid=o.caseNo;delete o.caseNo; cs.treatments=cs.treatments||[];
      const dup=cs.treatments.findIndex(t=>t.start===o.start&&t.drug===o.drug); if(dup>=0)cs.treatments[dup]=Object.assign(cs.treatments[dup],o);else cs.treatments.push(o);
      updates.set(cid,cs);nt++;}}
  toast(`กำลังบันทึก ${updates.size} เคส…`);
  for(const [id,c] of updates)await put('cases',id,c);
  toast(`นำเข้าเคส ${n} แถว · การรักษา ${nt} แถว · อัปเดต ${updates.size} เคส`);
}

const THI=(t,h)=>(t==null||h==null)?null:Math.round(((1.8*t+32)-(0.55-0.0055*h)*(1.8*t-26))*10)/10;
function barnCows(barn){if(!barn)return null;let n=0;const gi=S.herdCols.indexOf('Group');S.herd.forEach(r=>{if(barnFromGroup(r[gi])===barn)n++;});return n||null;}
function barnCases30(barn,date){const end=date||today(),start=addDays(end,-30);return Object.values(S.cases).filter(c=>c.barn===barn&&(c.dateDetected||'')>start&&(c.dateDetected||'')<=end).length;}
function riskEval(r){
  const f=[]; const lv=(v,a,b)=>v==null?null:v>=b?2:v>=a?1:0;
  const thi=r.thi??THI(r.temp,r.hum);
  f.push({k:'THI',v:thi==null?'–':fn(thi,1),l:lv(thi,68,72),n:'≥68 เริ่มเครียดจากความร้อน [5]'});
  f.push({k:'ความชื้นวัสดุรองนอน',v:r.moisture??'–',l:lv(r.moisture,3,4),n:'คะแนน 1–4 · ≥3 ชื้น [6]'});
  const bt=r.bedding||''; const bl=!bt?null:/ทราย/.test(bt)?0:/RMS|มูล/.test(bt)?2:1;
  f.push({k:'ชนิดวัสดุรองนอน',v:bt||'–',l:bl,n:'ทรายสะอาดเสี่ยงต่ำ อินทรีย์วัตถุเพิ่มเชื้อเร็ว [6]'});
  f.push({k:'Udder Score (% คะแนน 3–4)',v:r.udder==null?'–':fn(r.udder,0)+'%',l:lv(r.udder,20,30),n:'คะแนน 3–4 เสี่ยงเต้านมอักเสบสูงขึ้น [4]'});
  f.push({k:'Leg Score (% คะแนน 3–4)',v:r.leg==null?'–':fn(r.leg,0)+'%',l:lv(r.leg,20,40),n:'ขาสกปรกสะท้อนความสะอาดทางเดิน [7]'});
  f.push({k:'Bulk Tank SCC',v:r.btscc==null?'–':fn(r.btscc),l:lv(r.btscc,150000,400000),n:'เป้าหมาย <150,000 [1] · เกณฑ์ส่งออก 400,000 [8]'});
  const cows=r.cows||barnCows(r.barn); const cc=r.barn?barnCases30(r.barn,r.date):0; const rate=cows?100*cc/cows:null;
  f.push({k:'เคสคลินิก 30 วัน / 100 ตัว',v:rate==null?'–':fn(rate,1)+` (${cc} เคส)`,l:lv(rate,1.7,2.9),n:'เป้า <20/100 ตัว/ปี ≈ 1.7/เดือน [1]'});
  const known=f.filter(x=>x.l!=null); const sum=known.reduce((a,x)=>a+x.l,0); const hi=known.filter(x=>x.l===2).length;
  const level=!known.length?null:(hi>=2||sum>=6)?2:(hi>=1||sum>=3)?1:0;
  return{f,sum,level,thi};
}

function symptoms(c){const a=caseQuarters(c).map(x=>{const p=[];if(x.secretion)p.push('น้ำนม '+x.secretion);if(x.palpation)p.push('เต้า '+x.palpation.replace('Frim','Firm'));if(x.cmt)p.push('CMT '+x.cmt);return p.length?x.q+': '+p.join(', '):'';}).filter(Boolean);if(c.blood==='Yes')a.push('นมปนเลือด');if(c.fever==='Yes')a.push('มีไข้');if(c.appetite==='Yes')a.push('กินลด');if(c.downer==='Yes')a.push('ล้ม');return a.join(' | ');}

function buildMsg(id,h,c,cu,cs){

async function autoMatchCultures(recs){
  const ups=new Map();
  recs.filter(isMastitisCul).forEach(cu=>{ if(!cu.sent||!cu.org||!cu.cow)return;
    const spec=LISTS.quarter.filter(q=>String(cu.q||'').toUpperCase().includes(q));let best=null,bd=99;
    (casesByCow.get(norm(cu.cow))||[]).forEach(c=>{if(!c.dateDetected)return;const d=Math.abs(dDays(cu.sent,c.dateDetected));if(d>14)return;
      const qs=caseQuarters(c).map(x=>x.q);if(spec.length&&qs.length&&!spec.some(q=>qs.includes(q)))return;if(d<bd){bd=d;best=c;}});
    if(!best)return;const cur=ups.get(best.caseNo)||JSON.parse(JSON.stringify(best));if((cur.culture||'').includes(cu.lab))return;

  const decide=[];new Set(s.cases.map(c=>norm(c.cow))).forEach(k=>{const all=casesByCow.get(k)||[];const last=all[all.length-1];if(!last)return;
    const lac=all.filter(c=>!last.calving||(c.dateDetected||'')>=last.calving);const cmt3=lac.filter(c=>caseQuarters(c).some(x=>x.cmt==='3')).length;

  const head=document.createElement('div');head.className='print-only print-head';
  head.innerHTML=`<h1>${esc(title)}</h1><div class="src">One Stop Dairy Farm · ${esc(sub)}${sub?' · ':''}พิมพ์เมื่อ ${stamp}${S.userEmail?' · โดย '+esc(S.userEmail):''} · ข้อมูลฝูง ณ ${fd(S.herdMeta&&S.herdMeta.fileDate)}</div>`;
  v.prepend(head);
  const notes=[];
  document.querySelectorAll('#view textarea').forEach(t=>{if(!t.value.trim())return;const d=document.createElement('div');d.className='print-only print-note';d.textContent=t.value;t.after(d);notes.push(d);});
  const oldTitle=document.title;document.title=(kind==='cow'?'รายงานรายตัว_'+UI.cowQ:'รายงานเต้านมอักเสบ_'+(UI.showMonth&&UI.sumMonth?UI.sumMonth:UI.sumFrom+'_'+UI.sumTo)).replace(/[\\/:*?"<>|\s]+/g,'_');
  document.querySelectorAll('#view details').forEach(d=>{d.dataset.wasOpen=d.open?'1':'';d.open=true;});
  const done=()=>{head.remove();notes.forEach(n=>n.remove());document.title=oldTitle;document.querySelectorAll('#view details').forEach(d=>d.open=d.dataset.wasOpen==='1');window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  setTimeout(()=>{try{window.print();}catch(e){toast('อุปกรณ์นี้เปิดหน้าพิมพ์ไม่ได้ ใช้ ดาวน์โหลด Excel แทน');done();}},50);
  setTimeout(done,60000);
}

function secondaryAuth(){const app=firebase.apps.find(a=>a.name==='admin-create')||firebase.initializeApp(CFG,'admin-create');const a=app.auth();try{a.setPersistence(firebase.auth.Auth.Persistence.NONE);}catch(e){}return a;}
async function addUser(){
  const email=$('#nu_email').value.trim().toLowerCase(),name=$('#nu_name').value.trim(),role=$('#nu_role').value,pass=$('#nu_pass').value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('อีเมลไม่ถูกต้อง');return;}
  if(pass&&pass.length<6){toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');return;}
  if(!navigator.onLine){toast('ต้องออนไลน์เพื่อเพิ่มผู้ใช้');return;}
  if(!S.db){toast('โหมดทดลองเพิ่มผู้ใช้ไม่ได้');return;}
  const btn=$('#nu_btn');btn.disabled=true;
  try{
    // 1) grant access first: the rules check that the caller is an admin
    await S.db.collection('members').doc(email).set({role,name,addedBy:S.userEmail,addedAt:new Date().toISOString().slice(0,19)});
    // 2) create the sign-in account on a separate app instance so the admin stays signed in
    const sa=secondaryAuth();let made=false,msg='';
    const pw=pass||(Array.from(crypto.getRandomValues(new Uint8Array(18)),b=>b.toString(36).padStart(2,'0')).join('').slice(0,20)+'A9!');
    try{await sa.createUserWithEmailAndPassword(email,pw);made=true;}
    catch(e){if(e.code==='auth/email-already-in-use'){msg=' (มีบัญชีอยู่แล้ว ให้สิทธิ์เพิ่ม)';}else if(e.code==='auth/operation-not-allowed'){throw new Error('ยังไม่ได้เปิด Email/Password ใน Firebase Authentication');}else throw e;}
    if(!pass||!made){try{await sa.sendPasswordResetEmail(email);msg+=' · ส่งอีเมลตั้งรหัสผ่านแล้ว';}catch(e){msg+=' · ส่งอีเมลไม่สำเร็จ ('+e.code+')';}}
    try{await sa.signOut();}catch(e){}
    toast(`เพิ่ม ${email} เป็น${roleTh(role)}แล้ว${msg}`);
    ['nu_email','nu_name','nu_pass'].forEach(id=>$('#'+id).value='');
  }catch(e){toast('เพิ่มผู้ใช้ไม่สำเร็จ: '+(e.code==='permission-denied'?'บัญชีนี้ไม่มีสิทธิ์ผู้ดูแลระบบ ตรวจ role = admin และกฎ firestore.rules ฉบับใหม่':(e.message||e.code)));}
  btn.disabled=false;
}

if(location.hash&&location.hash!=='#quick'){try{history.replaceState(null,'',location.pathname+location.search+'#quick');}catch(e){location.hash='quick';}}
render(); connect();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
